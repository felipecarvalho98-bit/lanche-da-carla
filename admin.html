<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin - Lanche da Carla</title>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topo">
    <div class="topo-conteudo">
      <p class="subtitulo">Lanche da Carla</p>
      <h1>Admin</h1>
      <p class="descricao">Acompanhe os pedidos pelo celular</p>
    </div>
  </header>

  <main class="container">

    <section id="loginAdmin" class="login-admin">
        <h2>Acesso do administrador</h2>

        <label for="senhaAdmin">Digite a senha</label>
        <input type="password" id="senhaAdmin" placeholder="Senha do admin" />

        <button class="btn-confirmar" onclick="entrarAdmin()">
            Entrar
        </button>

        <p id="mensagemLogin" class="mensagem-cliente"></p>
    </section>

    <section id="painelAdmin" class="admin-area escondido">
<div class="admin-cabecalho">
  <h2 id="tituloAdmin">Pedidos recebidos</h2>

  <div class="admin-botoes">
    <button class="btn-atualizar" onclick="atualizarAbaAtual()">
      Atualizar
    </button>

    <button class="btn-sair-admin" onclick="sairAdmin()">
      Sair
    </button>
  </div>
</div>

<div class="abas-admin">
  <button onclick="mostrarAbaPedidos()">Pedidos</button>
  <button onclick="mostrarAbaProdutos()">Produtos</button>
</div>

    <div id="abaPedidos">
      <p id="mensagemAdmin" class="mensagem-cliente">
        Carregando pedidos...
      </p>

      <div class="modos-pedidos">
        <button id="btnFilaHoje" class="ativo" onclick="mostrarFilaHoje()">
          Fila de hoje
        </button>

        <button id="btnHistorico" onclick="mostrarHistoricoPedidos()">
          Pedidos anteriores
        </button>
      </div>

      <div class="filtros-status">
        <button onclick="filtrarPedidos('Todos')">Todos</button>
        <button onclick="filtrarPedidos('Novo')">Novos</button>
        <button onclick="filtrarPedidos('Preparando')">Preparando</button>
        <button onclick="filtrarPedidos('Saiu para entrega')">Entrega</button>
        <button onclick="filtrarPedidos('Concluído')">Concluídos</button>
        <button onclick="filtrarPedidos('Cancelado')">Cancelados</button>
      </div>

      <div id="listaPedidosAdmin" class="lista-pedidos-admin"></div>
    </div>

    <div id="abaProdutos" class="escondido">
      <p id="mensagemProdutos" class="mensagem-cliente"></p>

      <div class="form-produto-admin">
        <h3>Cadastrar ou editar produto</h3>

        <input type="hidden" id="produtoId" />

        <label for="produtoNome">Nome do produto</label>
        <input type="text" id="produtoNome" placeholder="Ex: Pastel queijo" />

        <label for="produtoCategoria">Categoria</label>
        <select id="produtoCategoria">
          <option value="pasteis">Pastéis</option>
          <option value="pratinhos">Pratinhos</option>
          <option value="bebidas">Bebidas</option>
        </select>

        <label for="produtoDescricao">Descrição</label>
        <input type="text" id="produtoDescricao" placeholder="Ex: Pastel tradicional de queijo" />

        <label for="produtoPreco">Preço</label>
        <input type="number" step="0.01" id="produtoPreco" placeholder="Ex: 6.00" />

        <label for="produtoAtivo">Produto ativo?</label>
        <select id="produtoAtivo">
          <option value="sim">Sim</option>
          <option value="não">Não</option>
        </select>

        <button class="btn-confirmar" onclick="salvarProdutoAdmin()">
          Salvar produto
        </button>

        <button class="btn-cancelar" onclick="limparFormularioProduto()">
          Limpar formulário
        </button>
      </div>

      <h3 class="titulo-lista-produtos">Produtos cadastrados</h3>

      <div id="listaProdutosAdmin" class="lista-produtos-admin"></div>
    </div>

  </main>

  <script src="js/admin.js"></script>
</body>
</html>
